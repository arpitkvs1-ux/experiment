# Builds a sideload-ready debug APK. Download from Actions → latest run → Artifacts.
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Write SDK path for Gradle
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android-app/local.properties

      - name: Grant gradlew execute
        run: chmod +x android-app/gradlew

      - name: Assemble debug APK
        working-directory: android-app
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK (install this on your phone)
        uses: actions/upload-artifact@v4
        with:
          name: KV-Student-Dashboard-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
