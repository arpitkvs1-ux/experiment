# Builds a debug APK on every push to main (when android-app or browser-app changes).
# Download: GitHub repo → Actions → latest workflow run → Artifacts → app-debug-apk.zip (contains app-debug.apk).
name: Android debug APK

on:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - "browser-app/**"
      - ".github/workflows/android-debug-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Gradle assembleDebug
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
