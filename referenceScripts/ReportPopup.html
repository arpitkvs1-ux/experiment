<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    /* Reset and Layout */
    html, body { 
      margin: 0; 
      padding: 0; 
      height: 100%; 
      font-family: 'Segoe UI', Tahoma, Geneva, sans-serif;
      overflow: hidden; /* Prevents double scrollbars */
    }
    
    body {
      display: flex;
      flex-direction: column;
      padding: 15px;
      box-sizing: border-box;
      background-color: #fdfdfd;
    }

    .header { 
      text-align: center; 
      border-bottom: 2px solid #003366; 
      padding-bottom: 10px; 
      flex-shrink: 0; 
    }
    .school-name { font-size: 20px; font-weight: bold; color: #003366; margin: 0; }
    .class-info { font-size: 15px; color: #d93025; margin: 5px 0; font-weight: bold; }
    
    /* Table Area: This is where the scrollbar will live */
    .table-container { 
      flex-grow: 1; 
      overflow: auto; 
      margin: 15px 0;
      border: 1px solid #ddd;
      background: white;
    }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { 
      background-color: #003366; 
      color: white; 
      padding: 10px; 
      position: sticky; 
      top: 0; 
      text-align: left; 
      z-index: 2;
    }
    td { border: 1px solid #eee; padding: 8px; white-space: nowrap; }
    tr:nth-child(even) { background-color: #f9f9f9; }
    
    /* Button Area: Locked to the bottom */
    .btn-container { 
      padding-top: 10px; 
      text-align: center; 
      display: flex; 
      justify-content: center; 
      gap: 12px; 
      flex-shrink: 0; 
      border-top: 1px solid #eee;
    }

    .btn { 
      padding: 10px 18px; 
      border: none; 
      border-radius: 4px; 
      color: white; 
      cursor: pointer; 
      font-weight: bold; 
      font-size: 13px;
      transition: background 0.2s;
    }
    .btn-save { background-color: #0F9D58; }
    .btn-pdf { background-color: #d93025; }
    .btn-close { background-color: #555; }
    .btn:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="header">
    <div class="school-name">Kendriya Vidyalaya NIT Agartala</div>
    <div class="class-info">Class VI - <?= reportTitle ?></div>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <? for (var i = 0; i < reportData[0].length; i++) { ?>
            <th><?= reportData[0][i] ?></th>
          <? } ?>
        </tr>
      </thead>
      <tbody>
        <? for (var i = 1; i < reportData.length; i++) { ?>
          <tr>
            <? for (var j = 0; j < reportData[i].length; j++) { ?>
              <td><?= (reportData[i][j] === "" ? "-" : reportData[i][j]) ?></td>
            <? } ?>
          </tr>
        <? } ?>
      </tbody>
    </table>
  </div>

  <div class="btn-container">
    <button class="btn btn-save" id="saveBtn" onclick="runExport('sheet')">Save as Sheet</button>
    <button class="btn btn-pdf" id="pdfBtn" onclick="runExport('pdf')">Download as PDF</button>
    <button class="btn btn-close" onclick="google.script.host.close()">Close</button>
  </div>

  <script>
  function runExport(actionType) {
    const btn = actionType === 'sheet' ? document.getElementById('saveBtn') : document.getElementById('pdfBtn');
    const originalText = btn.innerText;
    
    // Visual Feedback
    btn.innerText = "Processing...";
    btn.style.opacity = "0.5";
    btn.disabled = true;

    google.script.run
      .withSuccessHandler(function(url) {
        // Reset button state
        btn.innerText = originalText;
        btn.style.opacity = "1";
        btn.disabled = false;
        
        if (url) {
          // Open the link in a new tab
          const win = window.open(url, '_blank');
          if (!win) {
            alert('Popup blocked! Please allow popups for this spreadsheet to download the file.');
          }
        }
      })
      .withFailureHandler(function(err) {
        // This runs if there is an error in the Code.gs logic
        btn.innerText = originalText;
        btn.style.opacity = "1";
        btn.disabled = false;
        alert("Error: " + err.message);
      })
      .handleExportRequest(actionType, <?= JSON.stringify(reportTitle) ?>, <?= JSON.stringify(reportData) ?>);
  }
</script>
</body>
</html>
